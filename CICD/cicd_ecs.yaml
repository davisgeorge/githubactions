              .containerDefinitions[0].portMappings[0].hostPort = $hostPort |
              .containerDefinitions[0].logConfiguration.options."awslogs-group" = $awslogsGroup |
              .containerDefinitions[0].logConfiguration.options."awslogs-region" = $awslogsRegion |
              .cpu = ($cpu | tostring) |
              .memory = ($memory | tostring) |
              .executionRoleArn = $executionRoleArn |
              .taskRoleArn = $taskRoleArn' emi-user-task-def.json > updated-task-def.json
              mv updated-task-def.json emi-user-task-def.json
              cat  emi-user-task-def.json


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          # role-session-name: ECR-push
          aws-region: ${{env.AWS_REGION}}
          role-to-assume: ${{ secrets.ECS_EMITRADU_DEV_AWS_ECR_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: 'true'

      - name: Build application
        id: build-app
        shell: bash
        run: mvn clean package -s ${{ github.workspace }}/sharedlibrary/maven/configuration/settings.xml -DskipTests -Dmaven.resolver.transport=wagon -Dmaven.wagon.http.ssl.insecure=true -Dmaven.wagon.http.ssl.allowall=true -Dmaven.wagon.http.ssl.ignore.validity.dates=true -Dspring.profiles.active=${{env.ENV_NAME}}
   

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ENV: ${{ env.ENV_NAME }}
          IMAGE_TAG: ${{ env.IMG_TAG }}
          REPOSITORY: ${{ env.ECR_REPO }}
        run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build -t $ECR_REGISTRY/$REPOSITORY:$ENV-$IMAGE_TAG .
          docker push $ECR_REGISTRY/$REPOSITORY:$ENV-$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$REPOSITORY:$ENV-$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{secrets.ECS_EMITRADU_DEV_AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.ECS_EMITRADU_DEV_AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{env.AWS_REGION}}
          role-to-assume: ${{secrets.ECS_EMITRADU_DEV_ROLE_ARN}}
      
      - name: aws cli setup
        uses: tradu/onboardingemi-actions-shared-library/.github/actions/aws-cli/@ecs-develop

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: emi-user-task-def.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Check deployed version 
        run: |
           IMG_TASK_DEF=$(aws ecs describe-services --cluster emi-tradu-dev --service ${{ env.ECS_SERVICE }} --query "reverse(sort_by(services, &createdAt))[0].taskDefinition" --region ${{ env.AWS_REGION }} --output text)
           IMG_RUNNIG=$(aws ecs describe-task-definition --task-definition $IMG_TASK_DEF --query [taskDefinition.containerDefinitions[].image] --region ${{ env.AWS_REGION }} --output text)
           image=${{ steps.build-image.outputs.image }}
            
            echo "IMG_RUNNIG=$IMG_RUNNIG"
            echo "image=$image"
            
            if [[ "${IMG_RUNNIG}" == "${image}" ]]; then
                  echo "Deployment Successfull "
                  
              else
                        echo "Deployment failed image does not match "
                        echo "IMG that is running =$IMG_RUNNIG"
                        echo "image that we want to deploy =$image"
                        exit 1
            fi      


