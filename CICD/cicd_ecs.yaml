name: emi-user-ms-CICD-Pipeline
on:
  workflow_dispatch:
    inputs:
      Application_deployment_version:
        description: Production Application version
        default: "emitraduprod-user-version-1.0.0"
      Rollback:
        description: 'rollback?'
        required: false
        default: 'false'
        type: boolean
      Image_tag:
        description: 'Image_tag?'
        required: false
        type: string
  push:
    branches: ["ecs-develop"]
    
jobs:
  rollback:
    name: rollback
    if: ${{ github.event.inputs.Rollback == 'true' }}
    runs-on: [self-hosted, emitradu]
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Clear Workspace
        uses: AutoModality/action-clean@v1
        
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          repository: tradu/emi-user-ms
          fetch-depth: 0

      - name: Set Environment variables
        id: env-variables
        run: |
          if [[ ${{github.ref}} == "refs/heads/ecs-develop" ]]; then
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
            echo "IMG_TAG=`git rev-parse --short HEAD`" >> $GITHUB_ENV
            echo "ECS_CLUSTER=emi-tradu-dev" >> $GITHUB_ENV
            echo "ECS_SERVICE=user-dev-service" >> $GITHUB_ENV
            echo "ECR_REPO=emi-tradu/emi-user-ms" >> $GITHUB_ENV
            echo "ECS_CONTAINER=user-dev-service" >> $GITHUB_ENV
            echo "FAMILY=user-task-family" >> $GITHUB_ENV
            echo "CPU=1024" >> $GITHUB_ENV
            echo "MEMORY=3072" >> $GITHUB_ENV
            echo "CH_PORT=5000" >> $GITHUB_ENV
            echo "AWSLOGS_GROUP=/ecs/user-dev-service" >> $GITHUB_ENV
            echo "ECR_ACCOUNT_ID=833112348009" >> $GITHUB_ENV
            echo "ACCOUNT_ID=888245623353" >> $GITHUB_ENV
            echo "EMI_AWS_ACCESS_KEY_ID=${{ secrets.EMITRADU_DEV_AWS_ACCESS_KEY_ID}}" >> $GITHUB_ENV
            echo "EMI_AWS_SECRET_ACCESS_KEY=${{ secrets.EMITRADU_DEV_AWS_SECRET_ACCESS_KEY}}" >> $GITHUB_ENV
            echo "EMI_AWS_ROLE_TO_ASSUME=${{ secrets.EMITRADU_DEV_AWS_ROLE_ARN}}" >> $GITHUB_ENV
          elif [[ ${{github.ref}} == "refs/heads/develop" ]]; then
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
            echo "IMG_TAG=`git rev-parse --short HEAD`" >> $GITHUB_ENV
            echo "APP_NAME=emitradudev-user-srv" >> $GITHUB_ENV
            echo "EB_ENV_NAME=emitradudev-user-srv-env" >> $GITHUB_ENV
            echo "BUILD_FOLDER=emi-user-ms-dev" >> $GITHUB_ENV
            echo "EMI_AWS_ACCESS_KEY_ID=${{ secrets.EMITRADU_DEV_AWS_ACCESS_KEY_ID}}" >> $GITHUB_ENV
            echo "EMI_AWS_SECRET_ACCESS_KEY=${{ secrets.EMITRADU_DEV_AWS_SECRET_ACCESS_KEY}}" >> $GITHUB_ENV
            echo "EMI_AWS_ROLE_TO_ASSUME=${{ secrets.EMITRADU_DEV_AWS_ROLE_ARN}}" >> $GITHUB_ENV
            echo "APPLICATION_DEPLOYMENT_VERSION=${GITHUB_REF#refs/heads/}_${{ github.run_number }}_$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_ENV
          elif [[ ${{github.ref}} == "refs/heads/release_qa" ]]; then
            echo "ENV_NAME=qa" >> $GITHUB_ENV
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
            echo "APP_NAME=emitraduqa-user-srv" >> $GITHUB_ENV
            echo "EB_ENV_NAME=Emitraduqa-user-srv-env" >> $GITHUB_ENV
            echo "BUILD_FOLDER=emi-user-ms-qa" >> $GITHUB_ENV
            echo "EMI_AWS_ACCESS_KEY_ID=${{ secrets.EMITRADU_QA_AWS_ACCESS_KEY_ID}}" >> $GITHUB_ENV
            echo "EMI_AWS_SECRET_ACCESS_KEY=${{ secrets.EMITRADU_QA_AWS_SECRET_ACCESS_KEY}}" >> $GITHUB_ENV
            echo "EMI_AWS_ROLE_TO_ASSUME=${{ secrets.EMITRADU_QA_AWS_ROLE_ARN}}" >> $GITHUB_ENV
            echo "APPLICATION_DEPLOYMENT_VERSION=${GITHUB_REF#refs/heads/}_${{ github.run_number }}_$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_ENV
          elif [[ ${{github.ref}} == "refs/heads/release_uat" ]]; then
            echo "ENV_NAME=uat" >> $GITHUB_ENV
            echo "AWS_REGION=eu-central-1" >> $GITHUB_ENV
            echo "APP_NAME=emitraduuat-user-srv" >> $GITHUB_ENV
            echo "EB_ENV_NAME=emitraduuat-user-srv-env" >> $GITHUB_ENV
            echo "BUILD_FOLDER=emi-user-ms-uat" >> $GITHUB_ENV
            echo "EMI_AWS_ACCESS_KEY_ID=${{ secrets.EMITRADU_UAT_AWS_ACCESS_KEY_ID}}" >> $GITHUB_ENV
            echo "EMI_AWS_SECRET_ACCESS_KEY=${{ secrets.EMITRADU_UAT_AWS_SECRET_ACCESS_KEY}}" >> $GITHUB_ENV
            echo "EMI_AWS_ROLE_TO_ASSUME=${{ secrets.EMITRADU_UAT_AWS_ROLE_ARN}}" >> $GITHUB_ENV
            echo "APPLICATION_DEPLOYMENT_VERSION=${GITHUB_REF#refs/heads/}_${{ github.run_number }}_$(git rev-parse --short "$GITHUB_SHA")" >> $GITHUB_ENV
          elif [[ ${{github.ref}} == "refs/heads/main" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "AWS_REGION=eu-central-1" >> $GITHUB_ENV
            echo "APP_NAME=emitraduprod-user-srv" >> $GITHUB_ENV
            echo "EB_ENV_NAME=emitraduprod-user-srv-env" >> $GITHUB_ENV
            echo "BUILD_FOLDER=emi-user-ms-prod" >> $GITHUB_ENV
            echo "EMI_AWS_ACCESS_KEY_ID=${{ secrets.EMITRADU_PROD_AWS_ACCESS_KEY_ID}}" >> $GITHUB_ENV
            echo "EMI_AWS_SECRET_ACCESS_KEY=${{ secrets.EMITRADU_PROD_AWS_SECRET_ACCESS_KEY}}" >> $GITHUB_ENV
            echo "EMI_AWS_ROLE_TO_ASSUME=${{ secrets.EMITRADU_PROD_AWS_ROLE_ARN}}" >> $GITHUB_ENV
            echo "APPLICATION_DEPLOYMENT_VERSION=${{ inputs.Application_deployment_version }}" >> $GITHUB_ENV
          fi

      - name: Update ECS Task Definition JSON in place
        run: |
          jq --arg family "$FAMILY" \
            --arg name "$ECS_CONTAINER" \
            --arg image "$ECR_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO" \
            --argjson cpu "$CPU" \
            --argjson containerPort "$CH_PORT" \
            --argjson hostPort "$CH_PORT" \
            --arg awslogsGroup "$AWSLOGS_GROUP" \
            --arg awslogsRegion "$AWS_REGION" \
            --arg taskRoleArn "arn:aws:iam::$ACCOUNT_ID:role/ecs_task_role" \
            --arg executionRoleArn "arn:aws:iam::$ACCOUNT_ID:role/ecs_task_execution_role" \
            --argjson memory "$MEMORY" \
            '.family = $family |
              .containerDefinitions[0].name = $name |
              .containerDefinitions[0].image = $image |
              .containerDefinitions[0].cpu = $cpu |
              .containerDefinitions[0].portMappings[0].containerPort = $containerPort |
              .containerDefinitions[0].portMappings[0].hostPort = $hostPort |
              .containerDefinitions[0].logConfiguration.options."awslogs-group" = $awslogsGroup |
              .containerDefinitions[0].logConfiguration.options."awslogs-region" = $awslogsRegion |
              .cpu = ($cpu | tostring) |
              .memory = ($memory | tostring) |
              .executionRoleArn = $executionRoleArn |
              .taskRoleArn = $taskRoleArn' emi-user-task-def.json > updated-task-def.json
              mv updated-task-def.json emi-user-task-def.json
              cat  emi-user-task-def.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          # role-session-name: ECR-push
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.ECS_EMITRADU_DEV_AWS_ECR_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
        with:
          mask-password: 'true'
      
      - name: ROllback 
        run: |
          ECRREPO="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPO}}:"
          ENV=${{ env.ENV_NAME}}
          IMGTAG=${{ github.event.inputs.Image_tag }}

          IMGURI="$ECRREPO$ENV-$IMGTAG"
          echo "IMGURI=$IMGURI" >> $GITHUB_ENV
          echo "ENV= $ENV"
          echo $IMGURI
          echo "env var ${{ env.IMGURI }}"

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{secrets.ECS_EMITRADU_DEV_AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.ECS_EMITRADU_DEV_AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{env.AWS_REGION}}
          role-to-assume: ${{secrets.ECS_EMITRADU_DEV_ROLE_ARN}}


      - name: aws cli setup
        uses: tradu/onboardingemi-actions-shared-library/.github/actions/aws-cli/@ecs-develop

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: emi-user-task-def.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ env.IMGURI }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Check deployed version 
        run: |
          IMG_TASK_DEF=$(aws ecs describe-services --cluster emi-tradu-dev --service ${{ env.ECS_SERVICE }} --query "reverse(sort_by(services, &createdAt))[0].taskDefinition" --region ${{ env.AWS_REGION }} --output text)
          IMG_RUNNIG=$(aws ecs describe-task-definition --task-definition $IMG_TASK_DEF --query [taskDefinition.containerDefinitions[].image] --region ${{ env.AWS_REGION }} --output text)
          image=${{ env.IMGURI }}
            
            echo "IMG_RUNNIG=$IMG_RUNNIG"
            echo "image=$image"
            
            if [[ "${IMG_RUNNIG}" == "${image}" ]]; then
                  echo "Deployment Successfull "
                  
              else
                        echo "Deployment failed image does not match "
                        echo "IMG that is running =$IMG_RUNNIG"
                        echo "image that we want to deploy =$image"
                        exit 1
            fi      

  ci_cd_pipeline:
    if: ${{ github.event.inputs.Rollback == false }}
    runs-on: [self-hosted, emitradu]
    permissions:
     id-token: write
     contents: read
    steps:
      - name: Clear Workspace
        uses: AutoModality/action-clean@v1
        
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          repository: tradu/emi-user-ms
          fetch-depth: 0

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          owner: tradu
          repositories: onboardingemi-actions-shared-library
          app-id: ${{ secrets.EMITRADU_GITHUB_APP_APPID }}
          private-key: ${{ secrets.EMITRADU_GITHUB_APP_PRIVATE_KEY }}
         
      - name: Checkout SharedLibrary
        uses: actions/checkout@v3
        with:
          repository: tradu/onboardingemi-actions-shared-library
          ref: develop
          token: ${{ steps.app-token.outputs.token }}
          path: sharedlibrary
          
      - name: Set Environment variables
        id: env-variables
        run: |
          if [[ ${{github.ref}} == "refs/heads/ecs-develop" ]]; then
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
            echo "IMG_TAG=`git rev-parse --short HEAD`" >> $GITHUB_ENV
            echo "ECS_CLUSTER=emi-tradu-dev" >> $GITHUB_ENV
            echo "ECS_SERVICE=user-dev-service" >> $GITHUB_ENV
            echo "ECR_REPO=emi-tradu/emi-user-ms" >> $GITHUB_ENV
            echo "ECS_CONTAINER=user-dev-service" >> $GITHUB_ENV
            echo "FAMILY=user-task-family" >> $GITHUB_ENV
            echo "CPU=1024" >> $GITHUB_ENV
            echo "MEMORY=3072" >> $GITHUB_ENV
            echo "CH_PORT=5000" >> $GITHUB_ENV
            echo "AWSLOGS_GROUP=/ecs/user-dev-service" >> $GITHUB_ENV
            echo "ECR_ACCOUNT_ID=833129848009" >> $GITHUB_ENV
            echo "ACCOUNT_ID=888210423353" >> $GITHUB_ENV
            echo "APP_NAME=emitradudev-user-srv" >> $GITHUB_ENV
            echo "EB_ENV_NAME=emitradudev-user-srv-env" >> $GITHUB_ENV
            echo "BUILD_FOLDER=emi-user-ms-dev" >> $GITHUB_ENV
            echo "EMI_AWS_ACCESS_KEY_ID=${{ secrets.EMITRADU_DEV_AWS_ACCESS_KEY_ID}}" >> $GITHUB_ENV
            echo "EMI_AWS_SECRET_ACCESS_KEY=${{ secrets.EMITRADU_DEV_AWS_SECRET_ACCESS_KEY}}" >> $GITHUB_ENV
            echo "EMI_AWS_ROLE_TO_ASSUME=${{ secrets.EMITRADU_DEV_AWS_ROLE_ARN}}" >> $GITHUB_ENV
          elif [[ ${{github.ref}} == "refs/heads/develop" ]]; then
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
            echo "IMG_TAG=`git rev-parse --short HEAD`" >> $GITHUB_ENV
            echo "APP_NAME=emitradudev-user-srv" >> $GITHUB_ENV
            echo "EB_ENV_NAME=emitradudev-user-srv-env" >> $GITHUB_ENV
            echo "BUILD_FOLDER=emi-user-ms-dev" >> $GITHUB_ENV
            echo "EMI_AWS_ACCESS_KEY_ID=${{ secrets.EMITRADU_DEV_AWS_ACCESS_KEY_ID}}" >> $GITHUB_ENV
            echo "EMI_AWS_SECRET_ACCESS_KEY=${{ secrets.EMITRADU_DEV_AWS_SECRET_ACCESS_KEY}}" >> $GITHUB_ENV
            echo "EMI_AWS_ROLE_TO_ASSUME=${{ secrets.EMITRADU_DEV_AWS_ROLE_ARN}}" >> $GITHUB_ENV
          elif [[ ${{github.ref}} == "refs/heads/release_qa" ]]; then
            echo "ENV_NAME=qa" >> $GITHUB_ENV
            echo "AWS_REGION=us-east-1" >> $GITHUB_ENV
            echo "APP_NAME=emitraduqa-user-srv" >> $GITHUB_ENV
            echo "EB_ENV_NAME=Emitraduqa-user-srv-env" >> $GITHUB_ENV
            echo "BUILD_FOLDER=emi-user-ms-qa" >> $GITHUB_ENV
            echo "EMI_AWS_ACCESS_KEY_ID=${{ secrets.EMITRADU_QA_AWS_ACCESS_KEY_ID}}" >> $GITHUB_ENV
            echo "EMI_AWS_SECRET_ACCESS_KEY=${{ secrets.EMITRADU_QA_AWS_SECRET_ACCESS_KEY}}" >> $GITHUB_ENV
            echo "EMI_AWS_ROLE_TO_ASSUME=${{ secrets.EMITRADU_QA_AWS_ROLE_ARN}}" >> $GITHUB_ENV
          elif [[ ${{github.ref}} == "refs/heads/release_uat" ]]; then
            echo "ENV_NAME=uat" >> $GITHUB_ENV
            echo "AWS_REGION=eu-central-1" >> $GITHUB_ENV
            echo "APP_NAME=emitraduuat-user-srv" >> $GITHUB_ENV
            echo "EB_ENV_NAME=emitraduuat-user-srv-env" >> $GITHUB_ENV
            echo "BUILD_FOLDER=emi-user-ms-uat" >> $GITHUB_ENV
            echo "EMI_AWS_ACCESS_KEY_ID=${{ secrets.EMITRADU_UAT_AWS_ACCESS_KEY_ID}}" >> $GITHUB_ENV
            echo "EMI_AWS_SECRET_ACCESS_KEY=${{ secrets.EMITRADU_UAT_AWS_SECRET_ACCESS_KEY}}" >> $GITHUB_ENV
            echo "EMI_AWS_ROLE_TO_ASSUME=${{ secrets.EMITRADU_UAT_AWS_ROLE_ARN}}" >> $GITHUB_ENV
          elif [[ ${{github.ref}} == "refs/heads/main" ]]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "AWS_REGION=eu-central-1" >> $GITHUB_ENV
            echo "APP_NAME=emitraduprod-user-srv" >> $GITHUB_ENV
            echo "EB_ENV_NAME=emitraduprod-user-srv-env" >> $GITHUB_ENV
